name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The wrapper checksum is pinned in gradle-wrapper.properties; this refuses to run a
  # distribution that does not match it, so a tampered gradle-*.zip cannot execute on CI.
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `packages` has to be stated explicitly. The action's default is `tools platform-tools`,
      # and Google has retired the `tools` package from the SDK repository, so the default makes
      # sdkmanager exit 1 and the whole job dies before Gradle even starts.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # abortOnError is true, so any new lint error fails the job here.
      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-results/testDebugUnitTest/**/*.xml

  # The repo is public; catch a stray key or keystore before it lands.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
